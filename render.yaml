# Despliegue en Render (Blueprint). En Render: New > Blueprint > elegir el
# repositorio. Crea la base PostgreSQL, el backend y el frontend.
databases:
  - name: vortic-db
    plan: free

services:
  - type: web
    name: vortic-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: vortic-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://vortic-api.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://vortic-web.onrender.com"
      - key: MOTOR_TOKEN
        generateValue: true
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: N8N_WEBHOOK_SECRETO
        sync: false

  - type: web
    name: vortic-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://vortic-api.onrender.com/api"
